<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Diagnostic and Project Design Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--tb:#09A3E4;--td:#1655A3;--ink:#222;--mut:#666;--line:#dfe3e8;--soft:#F3F8FC;--vo:#EE7024;--vn:#111D4B;--red:#D64545;--yel:#E8A317;--grn:#4E9A3F;--bg:#fff;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Work Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:1.5}
a{color:var(--td)}
header.mast{background:var(--tb);color:#fff}
.mast-in{max-width:1100px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.mast svg{width:110px;height:auto;display:block}
.mast .kick{font-size:12px;letter-spacing:.4px;text-transform:uppercase;text-align:right;opacity:.95}
.hero{max-width:1100px;margin:0 auto;padding:22px 16px 6px}
.hero h1{font-size:30px;line-height:1.15;margin:0 0 6px;color:#111;letter-spacing:-.4px}
.hero p{margin:0;color:#444;border-left:4px solid var(--tb);padding-left:10px}
nav.steps{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.steps-in{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.steps button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#333;border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.steps button .n{display:inline-block;width:20px;height:20px;border-radius:50%;background:#eef2f6;color:var(--td);font-weight:700;font-size:12px;line-height:20px;text-align:center;margin-right:6px}
.steps button.on{background:var(--td);color:#fff;border-color:var(--td)}
.steps button.on .n{background:#fff}
.steps button.done .n{background:var(--tb);color:#fff}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
section.page{display:none}
section.page.on{display:block}
h2{font-size:22px;margin:4px 0 4px;color:#111}
h2 small{display:block;font-size:13px;font-weight:500;color:var(--mut);margin-top:2px}
h3{font-size:16px;color:var(--td);margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--tb)}
.lead{color:#444;margin:6px 0 14px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;background:#fff}
.q{margin:0 0 16px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.q > label.t,.q > .t{display:block;font-weight:600;margin-bottom:4px;color:#111}
.q .h{font-size:13px;color:var(--mut);margin:0 0 8px}
.q .qn{display:inline-block;min-width:34px;color:var(--tb);font-weight:700}
input[type=text],input[type=email],input[type=number],input[type=date],textarea,select{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid #cdd5de;border-radius:8px;background:#fff;color:#111}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--tb);outline-offset:0;border-color:var(--tb)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}.hero h1{font-size:24px}.mast .kick{text-align:left}}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--tb)}
.opt input{margin-top:3px;accent-color:var(--td)}
.opt.sel{background:var(--soft);border-color:var(--tb)}
.multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.cnt{font-size:12px;color:var(--mut);margin-top:6px}
.cnt.warn{color:var(--vo);font-weight:600}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.t th{background:#EEF6FC;color:var(--td);text-align:left;font-weight:600;padding:8px;border-bottom:2px solid var(--tb);font-size:13px}
table.t td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.c{text-align:center}
table.t td input,table.t td select,table.t td textarea{padding:6px 8px}
table.t td textarea{min-height:52px}
table.t tfoot td{font-weight:700;background:#fafbfc}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--td);background:var(--td);color:#fff;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--td)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.warn{background:#fff;color:#a33;border-color:#d99}
.btn.pos{background:#859539;border-color:#859539}
.rowdel{border:0;background:none;color:#a33;font-size:18px;cursor:pointer;line-height:1}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.note{background:var(--soft);border-left:4px solid var(--tb);padding:10px 12px;border-radius:6px;font-size:14px;margin:12px 0}
.note.sec{background:#FFF6EE;border-left-color:var(--vo)}
.light{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}
.l-r{background:var(--red)}.l-y{background:var(--yel)}.l-g{background:var(--grn)}.l-n{background:#c9ced6}
.dims{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:10px 0}
.dim{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.dim .nm{font-weight:600;font-size:14px;color:#111;min-height:40px}
.dim .sc{font-size:28px;font-weight:700;color:var(--td);margin:4px 0}
.bar{height:8px;background:#eef1f4;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%}
.dim .st{font-size:12px;color:var(--mut);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#EEF6FC;border:1px solid #cfe6f6;color:var(--td);border-radius:16px;padding:4px 10px;font-size:13px}
.chip.hot{background:#FFF1E6;border-color:#f7c9a6;color:#a64a10}
.toc{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:stretch;margin:12px 0}
.toc .box{border:2px solid var(--tb);border-radius:10px;padding:10px;background:#fff;font-size:13px;position:relative;min-height:90px}
.toc .box b{display:block;color:var(--td);font-size:12px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.toc .box:not(:last-child)::after{content:"\2192";position:absolute;right:-12px;top:40%;color:var(--tb);font-weight:700;background:#fff}
.toc .box.imp{border-color:var(--td);background:#EEF6FC}
.toc ul{margin:0;padding-left:16px}
@media(max-width:820px){.toc{grid-template-columns:1fr}.toc .box:not(:last-child)::after{content:"\2193";right:auto;left:50%;top:auto;bottom:-14px}}
.tree{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre;overflow-x:auto}
.prog{display:flex;align-items:center;gap:10px;margin:8px 0}
.prog .bar{flex:1}
.save{font-size:12px;color:var(--mut)}
.method{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.method .card{margin:0}
.method .card b{color:var(--td)}
footer.fin{max-width:1100px;margin:0 auto;padding:0 16px 30px}
.stripe{height:5px;background:linear-gradient(90deg,var(--tb) 0 50%,var(--vn) 50% 80%,var(--vo) 80% 100%);margin-bottom:12px}
.credits{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:#444}
.credits svg{width:70px;height:auto}
.credits img{height:34px}
.credits .sp{flex:1}
.transp{font-size:12px;color:#666;font-style:italic;margin:10px 0 0}
.only-print{display:none}
@media print{
 nav.steps,.nav,.noprint,.btn,.rowdel{display:none!important}
 section.page{display:block!important;page-break-before:always}
 section.page:first-of-type{page-break-before:auto}
 header.mast{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .q,.card,.dim{break-inside:avoid}
 .only-print{display:block}
 input,textarea,select{border:1px solid #bbb}
 body{font-size:12px}
}
</style>
</head>

<script>
const T = {"title": "Media Diagnostic and Project Design Toolkit", "subtitle": "Diagnose your media outlet, define goals and turn your ideas into fundable projects. Your answers stay on your device.", "kicker": "<b>Reporting in Exile</b> · Paris 2026<br>Finding Funding table", "byT": "Thomson Media · AGILE programme", "byV": "Developed by Versátiles | hi@weareversatile.org", "transp": "<b>Transparency note:</b> content prepared, selected and organised based on our own experience mentoring media outlets and journalists. Layout and translation done with the help of AI.", "transpPlain": "Transparency note: content prepared, selected and organised based on our own experience mentoring media outlets and journalists. Layout and translation done with the help of AI.", "ui": {"next": "Next", "prev": "Back", "total": "Total", "addrow": "Add row", "del": "Delete row", "other": "Other (please specify)", "selected": "{n} of {max} selected", "answered": "answered", "saved": "Saved on this device at", "themesHint": "Orange: suggested by your traffic light results. Blue: needs you selected in questions 12 and 27.", "noThemes": "Answer the diagnostic to see suggestions.", "ranking": "Your ideas ranked by priority (impact × feasibility)", "priority": "priority", "rankHint": "Take the top idea to the Theory of Change step.", "ready": "{n} of {t} documents ready"}, "pages": {"start": {"nav": "Start", "t": "How this toolkit works", "s": "About 60 to 90 minutes in total. You can stop and continue later.", "lead": "This toolkit guides your team through eight steps, from a quick diagnosis of your organisation to a project ready to present to funders."}, "profile": {"nav": "Profile", "t": "Organisation profile", "s": "Basic information about your media outlet."}, "diag": {"nav": "Diagnostic", "t": "Diagnostic", "s": "31 questions in five areas. About 20 minutes."}, "results": {"nav": "Results", "t": "Sustainability traffic light", "s": "Your results by area and suggested strengthening themes."}, "goals": {"nav": "Dreams and goals", "t": "Dreams, goals and project ideas", "s": "Look ahead: where do you want to be and which projects could take you there?"}, "toc": {"nav": "Theory of change", "t": "Theory of Change", "s": "Explain how your project leads to the change you want to see."}, "logframe": {"nav": "Logical framework", "t": "Logical framework and budget", "s": "Turn your theory of change into the format most funders ask for."}, "folder": {"nav": "Institutional folder", "t": "Institutional folder", "s": "Organise the documents funders usually ask for."}, "export": {"nav": "Save and export", "t": "Save, share and export", "s": "Keep a copy of your work."}}, "start": {"cards": [["1. Profile", "Basic data about your outlet, including exile context."], ["2. Diagnostic", "A self-assessment in five areas: editorial and audience, team and operations, technology and safety, finance and legal, data and impact."], ["3. Results", "An automatic traffic light per area and a list of themes to strengthen."], ["4. Dreams and goals", "Your vision, goals and project ideas, ranked by impact and feasibility."], ["5. Theory of change", "The logic of your project: problem, activities, results and long-term change."], ["6. Logical framework", "Objectives, indicators, sources of verification, assumptions and budget."], ["7. Institutional folder", "A checklist and a suggested folder structure for your key documents."], ["8. Save and export", "Download your work as a file, a Word document or a PDF."]], "privacy": "<b>Your data stays with you.</b> Nothing you type is sent to any server: answers are saved only in this browser on this device. On a shared or insecure device, use the \"Save\" button to download your file and then \"Clear all\". Do not write names of sources, exact locations of staff inside the country or bank details.", "how": "<b>Tip:</b> fill it in as a team. Download this file, open it in Chrome, Firefox, Edge or Safari, and work offline. Use \"Save progress\" regularly to keep a copy, and \"Load\" to continue on another computer."}, "h": {"edit": "A. Editorial value and audience", "ops": "B. Team and operations", "tech": "C. Technology, security and safety", "fin": "D. Finance and legal", "data": "E. Data, metrics and impact", "themes": "Suggested strengthening themes", "vision": "Vision and wishes", "goals": "Goals for the next 12 to 24 months", "ideas": "Project ideas", "tocview": "Your theory of change at a glance", "budget": "Budget", "pitch": "Project summary", "propCheck": "Before you submit: proposal checklist"}, "dims": {"edit": "Editorial value and audience", "ops": "Team and operations", "tech": "Technology, security and safety", "fin": "Finance and legal", "data": "Data, metrics and impact"}, "lights": {"r": "Red: priority to strengthen", "y": "Yellow: in progress", "g": "Green: solid", "n": "Not answered yet"}, "themes": {"edit": ["Audience research and segmentation", "Product development and value proposition"], "ops": ["Process documentation", "Roles, team structure and project management"], "tech": ["Digital security and backups", "Physical and psychosocial safety protocols", "Responsible use of AI"], "fin": ["Financial planning and scenarios", "Legal and tax compliance", "Revenue diversification and fundraising"], "data": ["KPIs and dashboards", "Impact measurement"]}, "notes": {"profileSec": "<b>Security:</b> only include contact details you are comfortable storing on this device. You can leave any field empty.", "diagHow": "Choose the option that best describes your situation <b>today</b>, not what you plan to do. There are no right or wrong answers: the clearer the picture, the more useful the results.", "lightsExplain": "<span class=\"light l-r\"></span>below 40% <span class=\"light l-y\"></span>40% to 69% <span class=\"light l-g\"></span>70% or more. The score only uses the multiple-choice questions of each area. It is a conversation starter for your team, not an external evaluation.", "nextSteps": "<b>Next:</b> discuss the results as a team. Pick two or three themes to strengthen first, and keep them in mind when you choose your project in the next step.", "ideasHow": "List your project ideas. Score <b>impact</b> (how much it advances your mission and sustainability) and <b>feasibility</b> (team, time, money, security) from 1 to 5. The toolkit ranks them for you.", "folderHow": "Funders ask for the same documents again and again. Keep them in one secure folder (encrypted, with a backup) and update them every six months. Mark the status of each one below.", "propCheck": "<ul><li>The project answers the call's objectives and our mission (see the decalogue in the Finding Funding toolkit).</li><li>The problem is described with data and a concrete audience.</li><li>Every result has at least one measurable indicator.</li><li>Activities, timeline and budget match each other.</li><li>Security costs and risks for staff on the ground are included.</li><li>The budget follows the funder's categories and rules (co-funding, overheads).</li><li>The team section shows who does what, with relevant experience, fellowships and awards.</li><li>We know how we will report results and keep the funder informed.</li><li>Someone outside the project has read the proposal before sending it.</li></ul>"}, "method": {"toc": [["What it is", "A theory of change describes the chain from what you do to the change you want to see, and the conditions that must be true for it to happen."], ["How to fill it", "Work from right to left: start with the long-term change, then the outcomes needed, then the outputs and activities. Write one idea per line."], ["Why funders like it", "It shows that your project is not a list of activities but a strategy, and makes it easier to define indicators."]], "lf": [["Goal", "The long-term change you contribute to (your impact)."], ["Specific objective", "What the project itself will achieve by the end (your main outcome)."], ["Results", "The concrete products o /* ---------- RENDER FIELDS ---------- */
function field(f){
  const q = T.q[f.id] || {};
  const num = f.num ? `<span class="qn">${f.num}</span>` : '';
  const head = `<div class="t">${num}${esc(q.l||f.id)}</div>${q.h?`<p class="h">${esc(q.h)}</p>`:''}`;
  let body='';
  if (f.type==='short' || f.type==='email' || f.type==='number' || f.type==='date'){
    const tp = f.type==='short'?'text':f.type;
    body = `<input type="${tp}" data-id="${f.id}" value="${esc(A(f.id,''))}">`;
  } else if (f.type==='text'){
    body = `<textarea data-id="${f.id}">${esc(A(f.id,''))}</textarea>`;
  } else if (f.type==='scale' || f.type==='single'){
    const v = A(f.id,null);
    body = `<div class="opts">`+q.o.map((o,i)=>`<label class="opt ${v===i?'sel':''}"><input type="radio" name="${f.id}" data-radio="${f.id}" value="${i}" ${v===i?'checked':''}><span>${esc(o)}</span></label>`).join('')+`</div>`;
  } else if (f.type==='multi'){
    const v = A(f.id,[]);
    body = `<div class="multi">`+q.o.map((o,i)=>`<label class="opt ${v.includes(i)?'sel':''}"><input type="checkbox" data-multi="${f.id}" value="${i}" ${v.includes(i)?'checked':''}><span>${esc(o)}</span></label>`).join('')+`</div>`;
    if (f.max) body += `<div class="cnt" id="cnt_${f.id}">${countTxt(f)}</div>`;
    if (f.other) body += `<input type="text" style="margin-top:6px" placeholder="${esc(T.ui.other)}" data-id="${f.id}_other" value="${esc(A(f.id+'_other',''))}">`;
  } else if (f.type==='grid'){
    const v = A(f.id,{});
    body = `<div class="tw"><table class="t"><thead><tr><th></th>`+q.c.map(c=>`<th class="c">${esc(c)}</th>`).join('')+`</tr></thead><tbody>`+
      q.r.map((r,ri)=>`<tr><td>${esc(r)}</td>`+q.c.map((c,ci)=>`<td class="c"><input type="radio" name="${f.id}_${ri}" data-grid="${f.id}" data-row="${ri}" value="${ci}" ${v[ri]===ci?'checked':''} aria-label="${esc(r)}: ${esc(c)}"></td>`).join('')+`</tr>`).join('')+`</tbody></table></div>`;
  } else if (f.type==='numtable'){
    const v = A(f.id,{});
    body = `<div class="tw"><table class="t"><thead><tr><th></th>`+q.c.map(c=>`<th>${esc(c)}</th>`).join('')+`<th>${esc(T.ui.total)}</th></tr></thead><tbody>`+
      q.r.map((r,ri)=>`<tr><td>${esc(r)}</td>`+q.c.map((c,ci)=>`<td><input type="number" min="0" data-num="${f.id}" data-k="${ri}_${ci}" value="${esc(v[ri+'_'+ci]||'')}"></td>`).join('')+`<td class="c" id="${f.id}_rt${ri}"></td></tr>`).join('')+
      `</tbody><tfoot><tr><td>${esc(T.ui.total)}</td>`+q.c.map((c,ci)=>`<td class="c" id="${f.id}_ct${ci}"></td>`).join('')+`<td class="c" id="${f.id}_gt"></td></tr></tfoot></table></div>`;
  } else if (f.type==='rows'){
    body = rowsTable(f, q);
  }
  return `<div class="q" id="q_${f.id}">${head}${body}</div>`;
}
function countTxt(f){ const n=(A(f.id,[])).length; return T.ui.selected.replace('{n}',n).replace('{max}',f.max); }

function rowsTable(f,q){
  const rows = A(f.id, f.seed? f.seed.map(()=>({})) : [{}]);
  const cols = f.cols; // [{k,type,w,opts?}]
  let h = `<div class="tw"><table class="t" id="tbl_${f.id}"><thead><tr>`+cols.map((c,i)=>`<th style="${c.w?'width:'+c.w:''}">${esc(q.c[i])}</th>`).join('')+(f.calc?`<th>${esc(T.ui.total)}</th>`:'')+`<th class="noprint"></th></tr></thead><tbody>`;
  rows.forEach((r,ri)=>{
    h += `<tr>`+cols.map((c,ci)=>{
      const val = r[c.k]!==undefined? r[c.k] : (f.seed && f.seed[ri] && f.seed[ri][c.k]!==undefined ? f.seed[ri][c.k] : '');
      if (c.type==='select'){ const ol = (q.sel && q.sel[c.k]) || []; return `<td><select data-rows="${f.id}" data-r="${ri}" data-k="${c.k}"><option value=""></option>`+ol.map((o,oi)=>`<option value="${oi}" ${String(val)===String(oi)?'selected':''}>${esc(o)}</option>`).join('')+`</select></td>`; }
      if (c.type==='fixed'){ const lab = (q.fixed && q.fixed[ri]) || ''; return `<td><b>${esc(lab)}</b></td>`; }
      if (c.type==='area') return `<td><textarea data-rows="${f.id}" data-r="${ri}" data-k="${c.k}">${esc(val)}</textarea></td>`;
      return `<td><input type="${c.type==='number'?'number':'text'}" ${c.type==='number'?'min="0" step="any"':''} data-rows="${f.id}" data-r="${ri}" data-k="${c.k}" value="${esc(val)}"></td>`;
    }).join('') + (f.calc?`<td class="c" id="${f.id}_t${ri}"></td>`:'') + `<td class="c noprint">${f.fixedRows?'':`<button class="rowdel" title="${esc(T.ui.del)}" data-del="${f.id}" data-r="${ri}">&times;</button>`}</td></tr>`;
  });
  h += `</tbody>`;
  if (f.sum || f.calc) h += `<tfoot><tr>`+cols.map((c,ci)=>`<td id="${f.id}_s_${c.k}" class="c">${ci===0?esc(T.ui.total):''}</td>`).join('')+(f.calc?`<td class="c" id="${f.id}_gt"></td>`:'')+`<td class="noprint"></td></tr></tfoot>`;
  h += `</table></div>`;
  if (!f.fixedRows) h += `<div style="margin-top:8px" class="noprint"><button class="btn ghost sm" data-add="${f.id}">+ ${esc(T.ui.addrow)}</button></div>`;
  return h;
}

  if (p.blocks) p.blocks.forEach(b=>{
    if (b.h) h += `<h3>${esc(T.h[b.h])}</h3>`;
    if (b.note) h += `<div class="note ${b.sec?'sec':''}">${T.notes[b.note]}</div>`;
    if (b.method) h += methodCards(b.method);
    if (b.fields) b.fields.forEach(f=>h+=field(f));
    if (b.special==='results') h += `<div id="results"></div>`;
    if (b.special==='tocview') h += `<div id="tocview"></div>`;
    if (b.special==='ideas') h += `<div id="ideasrank"></div>`;
    if (b.special==='folder') h += folderBlock();
    if (b.special==='export') h += exportBlock();
  });
  const i = SCHEMA.pages.findIndex(x=>x.id===p.id);
  h += `<div class="nav noprint">`+(i>0?`<button class="btn ghost" data-go="${i-1}">&larr; ${esc(T.ui.prev)}</button>`:'<span></span>')+
       (i<SCHEMA.pages.length-1?`<button class="btn" data-go="${i+1}">${esc(T.ui.next)} &rarr;</button>`:'')+`</div>`;
  return `<section class="page" id="p_${p.id}">${h}</section>`;
}
function startPage(){
  return `<div class="method">`+T.start.cards.map(c=>`<div class="card"><b>${esc(c[0])}</b><br>${esc(c[1])}</div>`).join('')+`</div>`+
   `<div class="note sec">${T.start.privacy}</div>`+
   `<div class="note">${T.start.how}</div>`;
}
function methodCards(k){ return `<div class="method">`+T.method[k].map(c=>`<div class="card"><b>${esc(c[0])}</b><br>${esc(c[1])}</div>`).join('')+`</div>`; }

function folderBlock(){
  const docs = T.folder.docs; const v = A('folder',{});
  let h = `<div class="tree">${esc(T.folder.tree)}</div>`;
  h += `<div class="prog"><span id="fprog"></span><div class="bar"><i id="fbar" style="width:0;background:var(--grn)"></i></div></div>`;
  h += `<div class="tw"><table class="t"><thead><tr><th>${esc(T.folder.c[0])}</th><th>${esc(T.folder.c[1])}</th><th>${esc(T.folder.c[2])}</th><th>${esc(T.folder.c[3])}</th></tr></thead><tbody>`;
  docs.forEach((d,i)=>{ const st = (v[i]||{}).s ?? ''; const nt=(v[i]||{}).n||'';
    h += `<tr><td>${esc(d[0])}</td><td><code>${esc(d[1])}</code></td><td><select data-folder="${i}" data-k="s"><option value=""></option>`+T.folder.st.map((s,si)=>`<option value="${si}" ${String(st)===String(si)?'selected':''}>${esc(s)}</option>`).join('')+`</select></td><td><input type="text" data-folder="${i}" data-k="n" value="${esc(nt)}"></td></tr>`; });
  h += `</tbody></table></div>`;
  return h;
}
function exportBlock(){
  return `<div class="card"><p>${T.exp.intro}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn" id="bSave">${esc(T.exp.save)}</button>
   <label class="btn ghost" style="cursor:pointer">${esc(T.exp.load)}<input type="file" id="bLoad" accept=".json,application/json" style="display:none"></label>
   <button class="btn ghost" id="bDoc">${esc(T.exp.doc)}</button>
   <button class="btn ghost" id="bPrint">${esc(T.exp.print)}</button>
   <button class="btn warn" id="bClear">${esc(T.exp.clear)}</button>
  </div><p class="save" id="savest"></p></div>
  <div class="note">${T.exp.tips}</div>`;
}

/* ---------- SCORING ---------- */
function scoreField(f){
  if (!f.score) return null;
  const v = A(f.id, null);
  if (f.type==='scale'){
    if (v===null || v===undefined) return null;
    if (f.na!==undefined && v===f.na) return null;
    const n = (T.q[f.id].o.length) - (f.na!==undefined?1:0);
    return v/(n-1);
  }
  if (f.type==='grid'){
    const rows = T.q[f.id].r.length; const vals = Object.values(v||{}); if(!vals.length) return null;
    const nc = T.q[f.id].c.length; let s=0; vals.forEach(x=>s+= x/(nc-1)); return s/vals.length;
  }
  if (f.type==='multi'){
    const arr = v||[]; if (!arr.length) return null;
    if (f.noneIdx!==undefined && arr.includes(f.noneIdx)) return 0;
    return Math.min(1, arr.length/(f.full||3));
  }
  return null;
}
function dimScores(){
  const out={};
  DIMS.forEach(d=>out[d]={sum:0,n:0,total:0});
  SCHEMA.pages.forEach(p=>(p.blocks||[]).forEach(b=>(b.fields||[]).forEach(f=>{
    if (f.score && f.dim){ out[f.dim].total++; const s=scoreField(f); if(s!==null){out[f.dim].sum+=s;out[f.dim].n++;} }
  })));
  return out;
}
function light(p){ if (p===null) return 'n'; return p<0.4?'r':(p<0.7?'y':'g'); }
function renderResults(){
  const el = $('#results'); if(!el) return;
  const ds = dimScores();
  let h = `<div class="dims">`;
  const themes = new Set();
  DIMS.forEach(d=>{
    const o = ds[d]; const p = o.n? o.sum/o.n : null; const L = light(p);
    const col = {r:'var(--red)',y:'var(--yel)',g:'var(--grn)',n:'#c9ced6'}[L];
    h += `<div class="dim"><div class="nm"><span class="light l-${L}"></span>${esc(T.dims[d])}</div><div class="sc">${p===null?'--':Math.round(p*100)+'%'}</div><div class="bar"><i style="width:${p===null?0:Math.round(p*100)}%;background:${col}"></i></div><div class="st">${esc(T.lights[L])} · ${o.n}/${o.total} ${esc(T.ui.answered)}</div></div>`;
    if (L==='r'||L==='y') T.themes[d].forEach(t=>themes.add('§'+t));
  });
  h += `</div><div class="note">${T.notes.lightsExplain}</div>`;
  // explicit needs
  const picked=[];
  (SCHEMA.needs||[]).forEach(id=>{ (A(id,[])||[]).forEach(i=>picked.push(T.q[id].o[i])); const ot=A(id+'_other',''); if(ot) picked.push(ot); });
  h += `<h3>${esc(T.h.themes)}</h3><p class="h">${esc(T.ui.themesHint)}</p><div class="chips">`+
    [...themes].map(t=>`<span class="chip hot">${esc(t.slice(1))}</span>`).join('')+
    [...new Set(picked)].map(t=>`<span class="chip">${esc(t)}</span>`).join('')+
    (!themes.size && !picked.length?`<span class="h">${esc(T.ui.noThemes)}</span>`:'')+`</div>`;
  el.innerHTML = h;
}
function renderIdeas(){
  const el = $('#ideasrank'); if(!el) return;
  const rows = (A('ideas',[])||[]).filter(r=>r.idea);
  if (!rows.length){ el.innerHTML=''; return; }
  const sc = rows.map(r=>({...r, p:(+r.imp||0)*(+r.fea||0)})).sort((a,b)=>b.p-a.p);
  el.innerHTML = `<div class="card"><b>${esc(T.ui.ranking)}</b><ol>`+sc.map(r=>`<li>${esc(r.idea)} <span class="h">(${esc(T.ui.priority)}: ${r.p}/25)</span></li>`).join('')+`</ol><p class="h">${esc(T.ui.rankHint)}</p></div>`;
}
function renderToc(){
  const el = $('#tocview'); if(!el) return;
  const li = s => (s||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('');
  const b = (k,cls='')=>`<div class="box ${cls}"><b>${esc(T.tocv[k])}</b><ul>${li(A('toc_'+k,''))||'<li class="h">...</li>'}</ul></div>`;
  el.innerHTML = `<div class="toc">${b('problem')}${b('activities')}${b('outputs')}${b('outcomes')}${b('impact','imp')}</div>`;
}
function calcTables(){
  // numtables
  document.querySelectorAll('[data-num]').forEach(()=>{});
  SCHEMA.pages.forEach(p=>(p.blocks||[]).forEach(b=>(b.fields||[]).forEach(f=>{
    if (f.type==='numtable'){ const q=T.q[f.id]; const v=A(f.id,{}); let gt=0; const ct=q.c.map(()=>0);
      q.r.forEach((r,ri)=>{ let rt=0; q.c.forEach((c,ci)=>{ const x=+v[ri+'_'+ci]||0; rt+=x; ct[ci]+=x; }); gt+=rt; const e=$('#'+f.id+'_rt'+ri); if(e) e.textContent=rt||''; });
      ct.forEach((x,ci)=>{ const e=$('#'+f.id+'_ct'+ci); if(e) e.textContent=x||''; }); const g=$('#'+f.id+'_gt'); if(g) g.textContent=gt||''; }
    if (f.type==='rows' && (f.sum||f.calc)){ const rows=A(f.id,[]); let gt=0; const sums={};
      rows.forEach((r,ri)=>{ if(f.calc){ const t=(+r[f.calc[0]]||0)*(+r[f.calc[1]]||0); gt+=t; const e=$('#'+f.id+'_t'+ri); if(e) e.textContent=t?t.toLocaleString():''; }
        (f.sum||[]).forEach(k=>{ sums[k]=(sums[k]||0)+(+r[k]||0); }); });
      (f.sum||[]).forEach(k=>{ const e=$('#'+f.id+'_s_'+k); if(e){ e.textContent = (sums[k]||0).toLocaleString() + (f.pct&&f.pct===k?'%':''); e.style.color = (f.pct===k && sums[k] && Math.round(sums[k])!==100)?'var(--vo)':''; } });
      if (f.calc){ const g=$('#'+f.id+'_gt'); if(g) g.textContent=gt?gt.toLocaleString():''; } }
  })));
  // folder progress
  const v=A('folder',{}); const n=T.folder.docs.length; let ok=0; Object.values(v).forEach(x=>{ if(String(x.s)==='0') ok++; });
  const fp=$('#fprog'); if(fp){ fp.textContent = T.ui.ready.replace('{n}',ok).replace('{t}',n); $('#fbar').style.width=(ok/n*100)+'%'; }
}
function refreshAll(){ renderResults(); renderIdeas(); renderToc(); calcTables(); markSteps(); }

/* ---------- NAV ---------- */
let cur = 0;
function markSteps(){
  document.querySelectorAll('#steps button').forEach((b,i)=>{ b.classList.toggle('on', i===cur); });
}
function go(i){ cur=+i; document.querySelectorAll('section.page').forEach((s,j)=>s.classList.toggle('on', j===cur)); markSteps(); S.cur=cur; save(); window.scrollTo({top:0,behavior:'smooth'}); refreshAll(); }

/* ---------- EVENTS ---------- */
function bind(){
  const m = $('#main');
  m.addEventListener('input', e=>{
    const t=e.target;
    if (t.dataset.id){ setA(t.dataset.id, t.value); if(t.dataset.id.startsWith('toc_')) renderToc(); }
    else if (t.dataset.num){ const v=A(t.dataset.num,{}); v[t.dataset.k]=t.value; setA(t.dataset.num,v); calcTables(); }
    else if (t.dataset.rows){ const rows=A(t.dataset.rows,[]); const f=findField(t.dataset.rows); while(rows.length<=+t.dataset.r) rows.push({});
      rows[+t.dataset.r][t.dataset.k]=t.value; setA(t.dataset.rows,rows); calcTables(); if(t.dataset.rows==='ideas') renderIdeas(); }
    else if (t.dataset.folder!==undefined){ const v=A('folder',{}); const i=t.dataset.folder; v[i]=v[i]||{}; v[i][t.dataset.k]=t.value; setA('folder',v); calcTables(); }
  });
  m.addEventListener('change', e=>{
    const t=e.target;
    if (t.dataset.radio){ setA(t.dataset.radio, +t.value); t.closest('.opts').querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', o.contains(t))); renderResults(); }
    else if (t.dataset.multi){ const id=t.dataset.multi; const f=findField(id); let v=A(id,[]).slice(); const i=+t.value;
      if (t.checked){ if (f.max && v.length>=f.max){ t.checked=false; const c=$('#cnt_'+id); if(c){c.classList.add('warn');} return; } v.push(i); } else v=v.filter(x=>x!==i);
      setA(id,v); t.closest('.opt').classList.toggle('sel', t.checked); const c=$('#cnt_'+id); if(c){ c.textContent=countTxt(f); c.classList.remove('warn'); } renderResults(); }
    else if (t.dataset.grid){ const v=A(t.dataset.grid,{}); v[t.dataset.row]=+t.value; setA(t.dataset.grid,v); renderResults(); }
    else if (t.dataset.rows && t.tagName==='SELECT'){ const rows=A(t.dataset.rows,[]); while(rows.length<=+t.dataset.r) rows.push({}); rows[+t.dataset.r][t.dataset.k]=t.value; setA(t.dataset.rows,rows); }
    else if (t.dataset.folder!==undefined && t.tagName==='SELECT'){ const v=A('folder',{}); const i=t.dataset.folder; v[i]=v[i]||{}; v[i][t.dataset.k]=t.value; setA('folder',v); calcTables(); }
    else if (t.id==='bLoad'){ loadFile(t.files[0]); }
  });
  m.addEventListener('click', e=>{
    const t=e.target.closest('button'); if(!t) return;
    if (t.dataset.go!==undefined) go(t.dataset.go);
    else if (t.dataset.add){ const id=t.dataset.add; const f=findField(id); const rows=A(id, f.seed? f.seed.map(s=>Object.assign({},s)) : [{}]); rows.push({}); setA(id,rows); rerenderField(f); }
    else if (t.dataset.del){ const id=t.dataset.del; const rows=A(id,[{}]); rows.splice(+t.dataset.r,1); if(!rows.length) rows.push({}); setA(id,rows); rerenderField(findField(id)); refreshAll(); }
    else if (t.id==='bSave') downloadJSON();
    else if (t.id==='bDoc') downloadDoc();
    else if (t.id==='bPrint') window.print();
    else if (t.id==='bClear'){ if (confirm(T.exp.confirm)){ S={v:1,lang:S.lang,a:{}}; try{localStorage.removeItem(KEY);}catch(e){} build(); } }
  });
  $('#steps').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) go(b.dataset.i); });
}
function allFields(){ const r=[]; SCHEMA.pages.forEach(p=>(p.blocks||[]).forEach(b=>(b.fields||[]).forEach(f=>r.push(f)))); return r; }
function findField(id){ return allFields().find(f=>f.id===id); }
function rerenderField(f){ const el=$('#q_'+f.id); if(el){ el.outerHTML = field(f); } calcTables(); }

/* ---------- EXPORT ---------- */
function stamp(){ const d=new Date(); return d.toISOString().slice(0,10); }
function slug(){ return (A('p_name','')||'media').toString().replace(/[^\w\-]+/g,'_').slice(0,40); }
function downloadBlob(content, name, type){ const b=new Blob([content],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
function downloadJSON(){ downloadBlob(JSON.stringify(S,null,2), `${slug()}_${T.exp.fileBase}_${stamp()}.json`, 'application/json'); }
function loadFile(file){ if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.a) throw 0; S=Object.assign({v:1,lang:S.lang,a:{}}, d); S.lang='en'; save(); build(); alert(T.exp.loaded); }catch(e){ alert(T.exp.bad); } }; r.readAsText(file); }
function valText(f){
  const q=T.q[f.id]||{}; const v=A(f.id,null);
  if (v===null || v==='' ) return '';
  if (f.type==='scale'||f.type==='single') return q.o[v]||'';
  if (f.type==='multi') return (v||[]).map(i=>q.o[i]).join('; ') + (A(f.id+'_other','')?'; '+A(f.id+'_other',''):'');
  if (f.type==='grid') return q.r.map((r,ri)=>v[ri]!==undefined? r+': '+q.c[v[ri]] : '').filter(Boolean).join('<br>');
  if (f.type==='numtable') return '<table border=1 cellpadding=4><tr><th></th>'+q.c.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+q.r.map((r,ri)=>'<tr><td>'+esc(r)+'</td>'+q.c.map((c,ci)=>'<td>'+esc(v[ri+'_'+ci]||'')+'</td>').join('')+'</tr>').join('')+'</table>';
  if (f.type==='rows'){ const rows=v||[]; if(!rows.length) return ''; return '<table border=1 cellpadding=4><tr>'+q.c.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+rows.map((r,ri)=>'<tr>'+f.cols.map(c=>{ let x=r[c.k]; if(c.type==='fixed') x=(q.fixed||[])[ri]; else if(c.type==='select' && x!==undefined && x!=='') x=(q.sel[c.k]||[])[x]; else if(x===undefined && f.seed && f.seed[ri]) x=f.seed[ri][c.k]; return '<td>'+esc(x||'')+'</td>'; }).join('')+'</tr>').join('')+'</table>'; }
  return esc(v).replace(/\n/g,'<br>');
}
function downloadDoc(){
  let h = `<html><head><meta charset="utf-8"><title>${esc(T.title)}</title><style>body{font-family:Arial;font-size:11pt}h1{color:#1655A3}h2{color:#1655A3;border-bottom:2px solid #09A3E4}td,th{font-size:10pt;vertical-align:top}</style></head><body>`;
  h += `<h1>${esc(T.title)}</h1><p><b>${esc(A('p_name',''))}</b> · ${stamp()}</p>`;
  const ds = dimScores();
  h += `<h2>${esc(T.pages.results.t)}</h2><table border=1 cellpadding=4>`+DIMS.map(d=>{ const o=ds[d]; const p=o.n?Math.round(o.sum/o.n*100)+'%':'--'; return `<tr><td>${esc(T.dims[d])}</td><td>${p}</td><td>${esc(T.lights[light(o.n?o.sum/o.n:null)])}</td></tr>`; }).join('')+`</table>`;
  SCHEMA.pages.forEach(p=>{ const fs=[]; (p.blocks||[]).forEach(b=>(b.fields||[]).forEach(f=>fs.push(f))); if(!fs.length) return;
    h += `<h2>${esc(T.pages[p.id].t)}</h2>`;
    fs.forEach(f=>{ const t=valText(f); if(t) h += `<p><b>${esc((f.num?f.num+' ':'')+(T.q[f.id]||{}).l)}</b><br>${t}</p>`; }); });
  const v=A('folder',{}); h += `<h2>${esc(T.pages.folder.t)}</h2><table border=1 cellpadding=4>`+T.folder.docs.map((d,i)=>`<tr><td>${esc(d[0])}</td><td>${esc(T.folder.st[(v[i]||{}).s]||'')}</td><td>${esc((v[i]||{}).n||'')}</td></tr>`).join('')+`</table>`;
  h += `<p style="color:#666;font-size:9pt"><i>${esc(T.transpPlain)}</i></p></body></html>`;
  downloadBlob('﻿'+h, `${slug()}_${T.exp.fileBase}_${stamp()}.doc`, 'application/msword');
}

/* ---------- BUILD ---------- */
function build(){
  document.title = T.title;
  $('#kick').innerHTML = T.kicker; $('#title').textContent=T.title; $('#subtitle').textContent=T.subtitle;
  $('#byT').textContent=T.byT; $('#byV').textContent=T.byV; $('#transp').innerHTML=T.transp;
  $('#steps').innerHTML = SCHEMA.pages.map((p,i)=>`<button data-i="${i}"><span class="n">${i+1}</span>${esc(T.pages[p.id].nav)}</button>`).join('');
  $('#main').innerHTML = SCHEMA.pages.map(renderPage).join('');
  allFields().forEach(f=>{ if(f.type==='rows' && f.seed && S.a[f.id]===undefined) S.a[f.id]=f.seed.map(x=>Object.assign({},x)); });
  cur = Math.min(S.cur||0, SCHEMA.pages.length-1);
  go(cur);
}
build(); bind();
</script>
</body>
