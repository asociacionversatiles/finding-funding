<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Finding Funding</title><link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;font-family:'Work Sans',system-ui,Arial,sans-serif;color:#222;background:#fff;line-height:1.5}
header{background:#fff;color:#3C3E40;position:relative}header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#2D368C 0%,#3054AA 35%,#3D80CB 70%,#44A0DE 100%)}.hin{max-width:960px;margin:0 auto;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header svg{width:140px;display:block}.kick b{color:#2D368C}.kick{font-size:12px;text-transform:uppercase;letter-spacing:.4px;text-align:right}
main{max-width:960px;margin:0 auto;padding:26px 16px}

.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
a.c{display:block;border:2px solid #09A3E4;border-radius:12px;padding:16px 18px;text-decoration:none;color:#222}
a.c:hover,a.c:focus{background:#EEF6FC;outline:none}
a.c b{display:block;font-size:12px;letter-spacing:.5px;color:#1655A3;margin-bottom:4px;text-transform:uppercase}
a.c span{display:block;font-size:18px;font-weight:600;color:#111}a.c small{display:block;color:#555;margin-top:6px;font-size:13px}
a.c.soon{border-style:dashed;opacity:.75;pointer-events:none}
.langs a{color:#1655A3;font-size:13px;margin-left:8px}
footer{max-width:960px;margin:0 auto;padding:0 16px 30px;font-size:13px;color:#444}
.s{height:5px;background:linear-gradient(90deg,#09A3E4 0 50%,#111D4B 50% 80%,#EE7024 80% 100%);margin-bottom:12px}
.cr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cr img{height:32px}.cr .sp{flex:1}
.t{font-style:italic;color:#666;font-size:12px;margin-top:8px}</style></head><body>
